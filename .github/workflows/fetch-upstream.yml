name: Fetch upstream for review
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/fetch-upstream.mjs
      - name: Update upstream tracking branch (no merge into main)
        run: git push origin refs/remotes/upstream/master:refs/heads/upstream-tracking
