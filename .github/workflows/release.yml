name: Release Obsidian plugin

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

env:
  PLUGIN_NAME: keronmisearch
  DIST_FOLDER: ./dist
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version: '24.x'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm run build

      - name: Package plugin
        run: |
          mkdir "${PLUGIN_NAME}"
          cp "${DIST_FOLDER}/main.js" "${PLUGIN_NAME}/main.js"
          cp "${DIST_FOLDER}/manifest.json" "${PLUGIN_NAME}/manifest.json"
          cp "${DIST_FOLDER}/styles.css" "${PLUGIN_NAME}/styles.css"
          zip -r "${PLUGIN_NAME}-${GITHUB_REF_NAME}.zip" "${PLUGIN_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${DIST_FOLDER}/manifest.json" \
            "${DIST_FOLDER}/main.js" \
            "${DIST_FOLDER}/styles.css" \
            "${PLUGIN_NAME}-${GITHUB_REF_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
